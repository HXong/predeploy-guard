runtime:
  type: docker-compose

service:
  name: my-service
  image: my-service:predeploy
  build:
    context: .
    dockerfile: Dockerfile
  port: 8080
  healthPath: /health

checks:
  smoke:
    - name: health check
      method: GET
      path: /health
      expectedStatus: 200

performance:
  enabled: true
  vus: 10
  duration: 15s
  thresholds:
    maxP95LatencyMs: 300
    maxErrorRate: 0.01
  endpoints:
    - name: health load
      method: GET
      path: /health

settings:
  cleanup: true
  timeoutSeconds: 60
