runtime:
  type: kubernetes
  context: minikube

service:
  name: nginx-demo
  image: nginx:1.27-alpine
  port: 80
  healthPath: /

gateway:
  enabled: true
  baseURL: http://127.0.0.1:8088
  ingress:
    enabled: true
    className: nginx
    pathType: Prefix
  routes:
    - name: homepage-via-ingress
      method: GET
      path: /
      expectedStatus: 200
      compareDirect: true

checks:
  smoke:
    - name: nginx homepage
      method: GET
      path: /
      expectedStatus: 200

workloads:
  - name: nginx repeated traffic
    type: http
    enabled: true
    method: GET
    path: /
    duration: 10s
    ratePerSecond: 5
    expectedStatus: 200
    failurePolicy: fail

performance:
  enabled: false

settings:
  namespacePrefix: predeploy
  cleanup: true
  timeoutSeconds: 120