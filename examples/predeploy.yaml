runtime:
  type: docker-compose

service:
  name: booking-service
  image: nginx:latest
  port: 80
  healthPath: /

dependencies:
  postgres:
    image: postgres:16
    port: 5432
    env:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: testdb
    readiness:
      command: ["pg_isready", "-U", "test", "-d", "testdb"]
      intervalSeconds: 2
      timeoutSeconds: 30

  redis:
    image: redis:7
    port: 6379
    readiness:
      command: ["redis-cli", "ping"]
      intervalSeconds: 2
      timeoutSeconds: 30

checks:
  smoke:
    - name: homepage check
      method: GET
      path: /
      expectedStatus: 200

settings:
  cleanup: true
  timeoutSeconds: 60